[build]
  command = "npm run build"
  # nitro's netlify preset writes static assets to dist/ and the SSR function to
  # .netlify/functions-internal/server. Netlify picks the function up automatically.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # Read by vite.config.ts -> nitro preset. Without this the build emits a
  # Cloudflare Worker and Netlify serves only static files (SSR + /ad + server
  # functions all 404).
  DEPLOY_PRESET = "netlify"

# No [[redirects]] block is needed: the SSR function is mounted at /* with
# preferStatic, so static assets win and every other path is server-rendered.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Admin panel and API responses must never be cached by a CDN.
[[headers]]
  for = "/czp-ops-9f2c/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ad/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Fingerprinted build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
